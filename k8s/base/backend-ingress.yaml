apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iotea-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: iotea-backend
                port:
                  number: 3000
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: iotea-backend
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: iotea-frontend
                port:
                  number: 80
