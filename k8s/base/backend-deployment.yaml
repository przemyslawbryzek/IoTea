apiVersion: apps/v1
kind: Deployment
metadata:
  name: iotea-backend
  labels:
    app.kubernetes.io/name: iotea-backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: iotea
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: iotea-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iotea-backend
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: iotea
    spec:
      containers:
        - name: iotea-backend
          image: iotea-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          startupProbe:
            httpGet:
              path: /api/health/live
              port: 3000
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: iotea-secrets
                  key: DATABASE_URL
