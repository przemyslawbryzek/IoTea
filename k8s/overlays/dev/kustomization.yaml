apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: iotea
resources:
  - ../../base
  - ../../addons/redis
  - ../../addons/emqx
  - secret.yaml
images:
  - name: iotea-backend
    newName: iotea-backend
    newTag: latest
  - name: iotea-frontend
    newName: iotea-frontend
    newTag: latest
  - name: iotea-worker-mqtt
    newName: iotea-worker-mqtt
    newTag: latest
