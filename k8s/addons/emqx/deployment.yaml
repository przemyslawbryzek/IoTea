apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: emqx
  labels:
    app.kubernetes.io/name: emqx
    app.kubernetes.io/component: broker
    app.kubernetes.io/part-of: iotea
spec:
  serviceName: emqx-headless
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: emqx
  volumeClaimTemplates:
    - metadata:
        name: emqx-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: emqx
        app.kubernetes.io/component: broker
        app.kubernetes.io/part-of: iotea
    spec:
      containers:
        - name: emqx
          image: emqx:5
          ports:
            - name: mqtt
              containerPort: 1883
            - name: mqtt-ws
              containerPort: 8083
            - name: dashboard
              containerPort: 18083
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: EMQX_NODE__NAME
              value: emqx@$(POD_NAME).emqx-headless.$(POD_NAMESPACE).svc.cluster.local
            - name: EMQX_CLUSTER__DISCOVERY_STRATEGY
              value: dns
            - name: EMQX_CLUSTER__DNS__NAME
              value: emqx-headless.$(POD_NAMESPACE).svc.cluster.local
            - name: EMQX_CLUSTER__DNS__RECORD_TYPE
              value: srv
            - name: EMQX_NODE__COOKIE
              valueFrom:
                secretKeyRef:
                  name: iotea-secrets
                  key: EMQX_COOKIE

            - name: EMQX_DASHBOARD__DEFAULT_USERNAME
              value: admin
            - name: EMQX_DASHBOARD__DEFAULT_PASSWORD
              value: admin

            - name: EMQX_MANAGEMENT__ENABLE
              value: "true"

            - name: EMQX_NODE__DATA_DIR
              value: "/opt/emqx/data"

            - name: EMQX_API_KEY__BOOTSTRAP_FILE
              value: "/opt/emqx/data/bootstrap_api_key"

            - name: EMQX_AUTHENTICATION__1__MECHANISM
              value: "password_based"
            - name: EMQX_AUTHENTICATION__1__BACKEND
              value: "built_in_database"
            - name: EMQX_AUTHENTICATION__1__ENABLE
              value: "true"
            - name: EMQX_AUTHENTICATION__1__PASSWORD_HASH_ALGORITHM__NAME
              value: "sha256"

          volumeMounts:
            - name: emqx-data
              mountPath: /opt/emqx/data
            - name: bootstrap-api-key
              mountPath: /opt/emqx/data/bootstrap_api_key
              subPath: bootstrap_api_key

          readinessProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 30
            periodSeconds: 10

      volumes:
        - name: bootstrap-api-key
          secret:
            secretName: emqx-bootstrap-api-key