apiVersion: v1
kind: Service
metadata:
  name: traefik
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: traefik
  ports:
    - name: web
      port: 80
      targetPort: 80
      nodePort: 30080
    - name: mqtt
      port: 1883
      targetPort: 1883
      nodePort: 31883
    - name: dashboard
      port: 8080
      targetPort: 8080
      nodePort: 30081
